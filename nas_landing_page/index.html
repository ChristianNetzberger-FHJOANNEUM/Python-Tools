<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slideshows</title>
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a2332;
      --card: #243044;
      --text: #e8eef4;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --accent-dim: #2a5fbf;
      --focus: #f5a623;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 45%, #111820 100%);
      color: var(--text);
      padding: clamp(1rem, 3vw, 2.5rem);
    }
    header {
      text-align: center;
      margin-bottom: clamp(1.5rem, 4vw, 2.75rem);
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .sub {
      color: var(--muted);
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      max-width: 36rem;
      margin: 0 auto;
      line-height: 1.45;
    }
    .banner {
      max-width: 40rem;
      margin: 1rem auto 0;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fcd34d;
      font-size: 0.88rem;
      line-height: 1.4;
      display: none;
    }
    .banner.show { display: block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap: clamp(1rem, 2.5vw, 1.35rem);
      max-width: 1200px;
      margin: 0 auto;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
      outline: none;
    }
    a.card:hover,
    a.card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 18px 40px rgba(0,0,0,0.45), 0 0 0 2px var(--focus);
    }
    .thumb {
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, var(--accent-dim) 0%, #1e3a5f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      object-fit: cover;
      width: 100%;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .body {
      padding: 1.1rem 1.2rem 1.25rem;
    }
    .body h2 {
      margin: 0 0 0.4rem;
      font-size: 1.2rem;
    }
    .meta {
      color: var(--muted);
      font-size: 0.88rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
    }
    footer {
      text-align: center;
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Slideshows</h1>
    <p class="sub">Karten aus <code style="color:#93c5fd;">manifest.json</code> (gleicher Ordner wie diese Seite). Photo-Tool: nach Export „In manifest.json schreiben“, wenn Publish-Root = Web-Ordner.</p>
    <div id="manifest-warning" class="banner" role="status"></div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    nginx / NAS · <code>manifest.json</code> + Unterordner pro Galerie (<code>index.html</code>)
  </footer>

  <script>
    (function () {
      const grid = document.getElementById('grid');
      const warn = document.getElementById('manifest-warning');

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;');
      }

      function cardHtml(g) {
        const href = (g.href || (g.slug ? g.slug + '/' : '#')).replace(/^\/?/, '');
        const hrefNorm = href.endsWith('/') ? href : href + '/';
        const title = g.title || g.slug || 'Galerie';
        const desc = g.description || '';
        const thumb = g.thumb;
        const thumbBlock = thumb
          ? '<div class="thumb"><img src="' + esc(thumb) + '" alt="" loading="lazy" /></div>'
          : '<div class="thumb" aria-hidden="true">&#x1F5BC;</div>';
        return (
          '<a class="card" href="' + esc(hrefNorm) + '">' +
          thumbBlock +
          '<div class="body"><h2>' + esc(title) + '</h2>' +
          '<div class="meta"><span>HTML-Slideshow</span>' +
          (desc ? '<span>' + esc(desc) + '</span>' : '') +
          '</div></div></a>'
        );
      }

      function showCards(galleries) {
        grid.innerHTML = galleries.map(cardHtml).join('');
 }

      function navCards() {
        const cards = () => Array.from(document.querySelectorAll('a.card'));
        document.addEventListener('keydown', function (e) {
          const list = cards();
          if (list.length === 0) return;
          const i = list.indexOf(document.activeElement);
          let next = i;
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            next = Math.min(i < 0 ? 0 : i + 1, list.length - 1);
            list[next].focus();
          } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            next = Math.max((i < 0 ? 1 : i) - 1, 0);
            list[next].focus();
          }
        });
      }

      fetch('manifest.json', { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          const list = data && Array.isArray(data.galleries) ? data.galleries : [];
          if (list.length === 0) {
            warn.textContent = 'manifest.json enthält keine Einträge (galleries).';
            warn.classList.add('show');
            return;
          }
          showCards(list);
          navCards();
        })
        .catch(function () {
          warn.textContent = 'manifest.json nicht gefunden oder ungültig — bitte Datei neben index.html ablegen (vom Photo-Tool schreiben lassen oder aus dem Repo kopieren).';
          warn.classList.add('show');
        });
    })();
  </script>
</body>
</html>
