# Slideshow Remote Hub on UGreen NAS (or any Docker host).
#
# Option A — Build on the NAS (copy this whole repo to the NAS, e.g. /volume1/docker/Python-tools):
#   docker compose -f compose.slideshow-hub.yml up -d --build
#
# Option B — No build on NAS: on any PC with Docker, build + save, then "Importieren" on UGreen:
#   docker build -f slideshow_hub/Dockerfile -t slideshow-hub:local .
#   docker save slideshow-hub:local -o slideshow-hub.tar
#   # copy slideshow-hub.tar to NAS → Docker UI → Importieren → run image with port 8090
#
# After start:
#   http://<NAS-IP>:8090/health
#   http://<NAS-IP>:8090/remote
# WebSocket base for TV + phone: ws://<NAS-IP>:8090/ws  (session appended by clients)
#
# --- Dauerhafte Konfiguration ---
# Diese Datei (lokal angepasst) auf die NAS legen und immer wieder mit demselben
# `docker compose -f ... up -d` starten. Dann bleiben Volume + SLIDESHUB_GALLERY_PATH_MAP
# nach jedem neuen Image erhalten (im Gegensatz zu „Image importieren → neuen Container per Hand“).
#
# Passe an: GALLERY_ORIGIN, Host-Pfad der web-Freigabe RECHTS in volumes muss zum
# rechten Wert in SLIDESHUB_GALLERY_PATH_MAP passen (hier beides /volume1/web).

services:
  slideshow-hub:
    build:
      context: .
      dockerfile: slideshow_hub/Dockerfile
    image: slideshow-hub:local
    container_name: slideshow-remote-hub
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SLIDESHUB_GALLERY_PATH_MAP: '{"http://192.168.0.100:8080":"/volume1/web"}'
    volumes:
      - /volume1/web:/volume1/web:rw
    # Optional: Originalbilder für ältere Setups mit Schreibzugriff auf source_path
    # - /volume1/photos:/photos:rw
